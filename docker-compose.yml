services:
  nginx:
    container_name: nginx
    build:
      context: ./nginx
    restart: always
    ports:
      - "80:80"
    links:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    container_name: frontend
    build:
      context: ./frontend
    restart: always
    env_file: ./frontend/.env.dev
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    container_name: backend
    build:
      context: ./backend
    restart: always
    volumes:
      - ./backend/src:/var/www/html/src
    env_file: ./backend/.env.dev
    links:
      - mysql
    networks:
      - app-network

  mysql:
    container_name: mysql
    image: mysql:8.4
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=laravel
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:

